<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Komari DDNS</title>
    <script>
      (function(){
        var key = "komari-ddns.theme";
        var systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
        var preference = "system";
        try {
          var saved = localStorage.getItem(key);
          if(saved === "light" || saved === "dark") preference = saved;
        } catch(e) {
          // The admin page can run in an iframe with storage disabled.
        }

        function applyTheme(){
          document.documentElement.dataset.theme = preference === "system"
            ? (systemTheme.matches ? "dark" : "light")
            : preference;
        }

        applyTheme();
        systemTheme.addEventListener("change", applyTheme);
        document.addEventListener("DOMContentLoaded", function(){
          var picker = document.getElementById("themePicker");
          picker.value = preference;
          picker.addEventListener("change", function(){
            preference = picker.value;
            applyTheme();
            try {
              if(preference === "system") localStorage.removeItem(key);
              else localStorage.setItem(key, preference);
            } catch(e) {
              // The selected theme still applies to the open page.
            }
          });
        });
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --page-bg: #f8f9fa;
        --surface: #fff;
        --surface-hover: #f9fafb;
        --surface-muted: #f3f4f6;
        --heading: #111827;
        --text: #1f2937;
        --text-secondary: #374151;
        --muted: #6b7280;
        --border: #e5e7eb;
        --control-border: #d1d5db;
        --shadow: #0000000a;
        --accent: #b54708;
        --accent-hover: #973b0a;
        --on-accent: #fff;
        --accent-bg: #fff7ed;
        --accent-text: #9a3412;
        --focus: #2563eb;
        --switch-track: #64748b;
        --switch-thumb: #fff;
        --success: #047857;
        --success-bg: #ecfdf5;
        --danger: #b91c1c;
        --danger-bg: #fef2f2;
        --danger-border: #fecaca;
        --info: #1d4ed8;
        --info-bg: #eff6ff;
        --sync-text: #4338ca;
        --sync-bg: #eef2ff;
        --warning: #92400e;
        --warning-bg: #fffbeb;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page-bg: #11151d;
        --surface: #191f2a;
        --surface-hover: #222a38;
        --surface-muted: #252e3d;
        --heading: #f4f6fa;
        --text: #e3e8f0;
        --text-secondary: #cbd5e1;
        --muted: #a8b5c8;
        --border: #354155;
        --control-border: #57667e;
        --shadow: #00000040;
        --accent: #fb923c;
        --accent-hover: #fdba74;
        --on-accent: #1f130d;
        --accent-bg: #422713;
        --accent-text: #fdba74;
        --focus: #93c5fd;
        --switch-track: #57667e;
        --switch-thumb: #f4f6fa;
        --success: #6ee7b7;
        --success-bg: #183528;
        --danger: #fca5a5;
        --danger-bg: #47242b;
        --danger-border: #85404a;
        --info: #93c5fd;
        --info-bg: #1f3453;
        --sync-text: #c7d2fe;
        --sync-bg: #2c3054;
        --warning: #fcd34d;
        --warning-bg: #41341f;
      }

      * { box-sizing: border-box; }
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 24px; color: var(--text); background: var(--page-bg); }
      .container { max-width: 1200px; margin: 0 auto; }
      h2 { margin: 0 0 4px; font-size: 22px; font-weight: 600; color: var(--heading); }
      .page-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; column-gap: 16px; }
      .theme-picker { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; color: var(--text-secondary); font-size: 14px; }
      .sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
      .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
      .left { display: flex; gap: 10px; align-items: center; }
      button { border: none; border-radius: 6px; padding: 8px 16px; font-size: 14px; cursor: pointer; font-weight: 500; }
      button.primary { background: var(--accent); color: var(--on-accent); }
      button.primary:hover { background: var(--accent-hover); }
      button.secondary { background: var(--surface); color: var(--text-secondary); border: 1px solid var(--control-border); }
      button.secondary:hover { background: var(--surface-hover); }
      button.danger { background: var(--surface); color: var(--danger); border: 1px solid var(--danger-border); }
      button.danger:hover { background: var(--danger-bg); }
      :is(button, input, select):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      button:disabled { opacity: .6; cursor: default; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 1px 2px var(--shadow); }
      #listPanel, #logPanel { overflow-x: auto; }
      #logPanel table { min-width: 560px; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      thead th { text-align: left; padding: 12px 16px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); background: var(--surface-hover); }
      thead th:first-child { border-top-left-radius: 8px; }
      thead th:last-child { border-top-right-radius: 8px; }
      tbody td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
      tbody tr:hover { background: var(--surface-hover); }
      tbody tr:last-child td { border-bottom: none; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
      .name { color: var(--heading); font-weight: 500; }
      .type { color: var(--text-secondary); }
      .ip { color: var(--success); font-weight: 500; }
      .empty-cell { color: var(--muted); }
      .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--surface-muted); color: var(--text-secondary); }
      .tag.proxied { background: var(--accent-bg); color: var(--accent-text); }
      .tag .cloud { width: 14px; height: 14px; fill: currentColor; }
      .actions { display: flex; gap: 8px; }
      .actions button { padding: 6px 12px; font-size: 13px; }
      .edit-btn { color: var(--info); background: transparent; border: none; }
      .edit-btn:hover { background: var(--info-bg); }
      .delete-btn { color: var(--danger); background: transparent; border: none; }
      .delete-btn:hover { background: var(--danger-bg); }
      .empty { padding: 40px; text-align: center; color: var(--muted); font-size: 14px; }
      .msg { min-height: 20px; margin-bottom: 14px; font-size: 14px; }
      .msg.ok { color: var(--success); }
      .msg.err { color: var(--danger); }

      /* Edit panel */
      .edit-panel { padding: 20px; margin-bottom: 16px; }
      .edit-title { font-size: 16px; font-weight: 600; margin: 0 0 16px; color: var(--heading); }
      .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
      .field { display: flex; flex-direction: column; gap: 6px; }
      .field label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
      .field input[type=text], .field input[type=number], .field select, .theme-picker select { padding: 9px 12px; border: 1px solid var(--control-border); border-radius: 6px; font-size: 14px; color: var(--heading); background: var(--surface); }
      .field input::placeholder { color: var(--muted); }
      .field select[multiple] { height: 90px; }
      .field small { color: var(--muted); font-size: 12px; font-weight: 400; }
      .field small.line-error { color: var(--danger); }
      #retryLines { align-self: flex-start; padding: 4px 8px; font-size: 12px; }
      .toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
      .toggle input { display: none; }
      .switch { width: 40px; height: 22px; border-radius: 999px; background: var(--switch-track); position: relative; transition: background .2s; }
      .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--switch-thumb); transition: transform .2s; }
      .toggle input:checked + .switch { background: var(--accent); }
      .toggle input:checked + .switch::after { background: var(--on-accent); transform: translateX(18px); }
      .toggle-text { font-size: 14px; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; }
      .edit-actions { display: flex; gap: 10px; margin-top: 20px; }
      .hidden { display: none; }
      .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
      .tab { background: transparent; border: none; padding: 10px 18px; font-size: 14px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; border-radius: 0; font-weight: 500; }
      .tab:hover { color: var(--text-secondary); }
      .tab.active { color: var(--heading); font-weight: 600; border-bottom-color: var(--accent); }
      .log-toolbar { display: flex; gap: 10px; align-items: center; padding: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
      .log-toolbar select, .log-toolbar input { padding: 8px 10px; border: 1px solid var(--control-border); border-radius: 6px; font-size: 14px; color: var(--heading); background: var(--surface); }
      .hint { color: var(--muted); font-size: 13px; }
      .act { font-size: 12px; padding: 2px 10px; border-radius: 999px; font-weight: 600; display: inline-block; }
      .act.create { background: var(--success-bg); color: var(--success); }
      .act.update { background: var(--info-bg); color: var(--info); }
      .act.skip { background: var(--surface-muted); color: var(--muted); }
      .act.error { background: var(--danger-bg); color: var(--danger); }
      .act.sync { background: var(--sync-bg); color: var(--sync-text); }
      .act.delete { background: var(--danger-bg); color: var(--danger); }
      .act.add { background: var(--success-bg); color: var(--success); }
      .act.edit { background: var(--warning-bg); color: var(--warning); }
      .detail-err { color: var(--danger); }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="page-header">
        <div>
          <h2>Komari DDNS</h2>
          <div class="sub">根据 Komari 节点上报的公网 IP 自动更新 Cloudflare 和腾讯云 DNSPod 解析记录</div>
        </div>
        <div class="theme-picker">
          <label for="themePicker">外观</label>
          <select id="themePicker">
            <option value="system">跟随系统</option>
            <option value="light">亮色</option>
            <option value="dark">暗色</option>
          </select>
        </div>
      </header>

      <div class="toolbar">
        <div class="left">
          <button id="add" class="primary">+ 添加记录</button>
          <button id="sync" class="secondary">立即同步全部</button>
        </div>
        <div id="msg" class="msg"></div>
      </div>

      <div id="editPanel" class="card edit-panel hidden">
        <div id="editTitle" class="edit-title">添加记录</div>
        <div class="form-grid">
          <div class="field">
            <label>名称</label>
            <input type="text" id="fName" placeholder="home.example.com" />
          </div>
          <div class="field">
            <label for="fProvider">DNS 提供商</label>
            <select id="fProvider">
              <option value="cloudflare">Cloudflare</option>
              <option value="dnspod">腾讯云 DNSPod（中国站）</option>
            </select>
          </div>
          <div class="field hidden" data-dnspod>
            <label for="fDomain">DNSPod 解析域名</label>
            <input type="text" id="fDomain" placeholder="example.com" />
          </div>
          <div class="field hidden" data-dnspod>
            <label for="fLine">线路类型</label>
            <select id="fLine" aria-describedby="lineStatus" disabled>
              <option value="">请先填写解析域名</option>
            </select>
            <small id="lineStatus" role="status"></small>
            <button type="button" id="retryLines" class="secondary hidden">重试加载</button>
          </div>
          <div class="field hidden" data-dnspod>
            <label for="fWeight">权重</label>
            <input type="number" id="fWeight" min="0" max="100" step="1" placeholder="留空保留现有权重" />
            <small>填写 0 关闭权重，1–100 设置权重。</small>
          </div>
          <div class="field hidden" data-dnspod>
            <label for="fRecordId">DNSPod 记录 ID</label>
            <input type="number" id="fRecordId" min="1" step="1" placeholder="可选" />
            <small>同名、同类型、同线路有多条记录时填写。</small>
          </div>
          <div class="field">
            <label>类型</label>
            <select id="fType">
              <option value="A">A</option>
              <option value="AAAA">AAAA</option>
            </select>
          </div>
          <div class="field">
            <label>来源节点 <small>（记录将使用此节点上报的公网 IP）</small></label>
            <select id="fSource"></select>
          </div>
          <div class="field" id="proxyField">
            <label>代理状态</label>
            <label class="toggle">
              <input type="checkbox" id="fProxied" />
              <span class="switch"></span>
              <span class="toggle-text">
                <svg class="cloud" viewBox="0 0 24 24"><path d="M18.5 10.5c-.4 0-.7 0-1.1.1-.6-2.4-2.8-4.1-5.4-4.1-2.9 0-5.3 2.1-5.8 4.9-.3-.1-.7-.1-1-.1-2.5 0-4.5 2-4.5 4.5s2 4.5 4.5 4.5h13c2.5 0 4.5-2 4.5-4.5s-2-4.7-4.5-4.7z"/></svg>
                <span id="proxyText">未代理</span>
              </span>
            </label>
          </div>
          <div class="field" id="cloudflareTtlField">
            <label for="fTtl">TTL</label>
            <select id="fTtl">
              <option value="1" selected>自动</option>
              <option value="60">1 分钟</option>
              <option value="120">2 分钟</option>
              <option value="300">5 分钟</option>
              <option value="600">10 分钟</option>
              <option value="900">15 分钟</option>
              <option value="1800">30 分钟</option>
              <option value="3600">1 小时</option>
              <option value="7200">2 小时</option>
              <option value="18000">5 小时</option>
              <option value="43200">12 小时</option>
              <option value="86400">1 天</option>
            </select>
          </div>
          <div class="field hidden" data-dnspod>
            <label for="fDNSPodTtl">TTL（秒）</label>
            <input type="number" id="fDNSPodTtl" min="1" max="604800" step="1" aria-describedby="dnspodTtlHelp" />
            <small id="dnspodTtlHelp">最低值取决于套餐，例如免费版 600 秒、专业版 60 秒。</small>
          </div>
          <div class="field">
            <label>备注</label>
            <input type="text" id="fComment" placeholder="可选" />
          </div>
        </div>
        <div class="edit-actions">
          <button id="save" class="primary">保存</button>
          <button id="cancel" class="secondary">取消</button>
          <button id="delEdit" class="danger hidden">删除</button>
        </div>
      </div>

      <div class="tabs">
        <button id="tabRecords" class="tab active">记录</button>
        <button id="tabLogs" class="tab">日志</button>
      </div>

      <div id="listPanel" class="card">
        <table>
          <thead>
            <tr>
              <th>名称</th>
              <th>类型</th>
              <th>来源节点</th>
              <th>DNS 提供商</th>
              <th>代理 / 线路与权重</th>
              <th>TTL</th>
              <th>内容</th>
              <th>备注</th>
              <th style="width:120px">操作</th>
            </tr>
          </thead>
          <tbody id="listBody"></tbody>
        </table>
        <div id="empty" class="empty hidden">暂无记录，点击「添加记录」开始配置。</div>
      </div>

      <div id="logPanel" class="card hidden">
        <div class="log-toolbar">
          <select id="logRecord"><option value="">全部记录</option></select>
          <select id="logAction"><option value="">全部操作</option></select>
          <input type="number" id="logLimit" value="100" min="1" max="1000" style="width:90px" />
          <span class="hint">条（最多 1000）</span>
          <button id="logRefresh" class="secondary">刷新</button>
          <button id="logClear" class="danger">清空日志</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>时间</th>
              <th>记录</th>
              <th>类型</th>
              <th>操作</th>
              <th>详情</th>
            </tr>
          </thead>
          <tbody id="logBody"></tbody>
        </table>
        <div id="logEmpty" class="empty hidden">暂无日志。</div>
      </div>
    </div>

    <script>
      var RECORDS_URL = "/cf-ddns/records";
      var NODES_URL = "/cf-ddns/nodes";
      var STATUS_URL = "/cf-ddns/status";
      var SYNC_URL = "/cf-ddns/sync";
      var DNSPOD_LINES_URL = "/cf-ddns/dnspod-lines";

      var NODES = [];
      var records = [];
      var state = {};
      var editingIndex = -1;
      var lineLookupDomain = "";
      var lineLookupTimer;
      var lineLookupVersion = 0;
      var DNSPOD_DEFAULT_TTL = 600;

      var CLOUD_SVG = '<svg class="cloud" viewBox="0 0 24 24"><path d="M18.5 10.5c-.4 0-.7 0-1.1.1-.6-2.4-2.8-4.1-5.4-4.1-2.9 0-5.3 2.1-5.8 4.9-.3-.1-.7-.1-1-.1-2.5 0-4.5 2-4.5 4.5s2 4.5 4.5 4.5h13c2.5 0 4.5-2 4.5-4.5s-2-4.7-4.5-4.7z"/></svg>';

      var TTL_LABELS = {
        1: "自动",
        60: "1 分钟",
        120: "2 分钟",
        300: "5 分钟",
        600: "10 分钟",
        900: "15 分钟",
        1800: "30 分钟",
        3600: "1 小时",
        7200: "2 小时",
        18000: "5 小时",
        43200: "12 小时",
        86400: "1 天"
      };
      function ttlText(v){ var n = Number(v); return TTL_LABELS[n] || (n ? n + " 秒" : "—"); }
      function configuredDNSPodTTL(rec){ return rec.ttl_seconds ?? (rec.ttl === 1 ? undefined : rec.ttl); }

      function el(tag, cls, text){
        var e = document.createElement(tag);
        if(cls) e.className = cls;
        if(text!==undefined) e.textContent = text;
        return e;
      }
      function fmt(ts){ if(!ts) return "—"; try { return new Date(ts).toLocaleString(); } catch(e){ return ts; } }
      function msg(text, cls){ var m = document.getElementById("msg"); m.textContent = text || ""; m.className = "msg " + (cls||""); }
      function recordKey(rec){
        if(rec.provider !== "dnspod") return rec.record_name + "#" + rec.record_type;
        var target = rec.record_id ? "id:" + rec.record_id : "line:" + (rec.record_line || "默认");
        return ["dnspod:" + rec.domain, rec.record_name, rec.record_type, target].join("#");
      }
      function dnsName(value){ return value.trim().toLowerCase().replace(/\.$/, ""); }
      function nodeName(uuid){ var n = NODES.find(function(x){ return x.uuid === uuid; }); return n ? n.name : uuid.slice(0,8); }

      async function loadNodes(){
        try { var r = await fetch(NODES_URL, { credentials: "same-origin" }); if(r.ok) NODES = await r.json(); }
        catch(e){ NODES = []; }
      }

      async function loadState(){
        try { var r = await fetch(STATUS_URL, { credentials: "same-origin" }); if(r.ok) state = await r.json(); else state = {}; }
        catch(e){ state = {}; }
      }

      function sourceNodeText(uuids){
        if(!uuids || uuids.length === 0) return el("span", "empty-cell", "—");
        var names = uuids.map(nodeName);
        return document.createTextNode(names.join(", "));
      }

      function proxiedTag(on){
        var t = el("span", "tag " + (on ? "proxied" : ""), on ? "已代理" : "未代理");
        t.innerHTML = CLOUD_SVG + (on ? "已代理" : "未代理");
        return t;
      }

      function renderList(){
        var tbody = document.getElementById("listBody");
        var empty = document.getElementById("empty");
        tbody.innerHTML = "";
        if(records.length === 0){ empty.classList.remove("hidden"); return; }
        empty.classList.add("hidden");
        records.forEach(function(rec, i){
          var tr = el("tr");
          var key = recordKey(rec);
          var st = state[key] || {};

          var tdName = el("td"); tdName.appendChild(el("span", "mono name", rec.record_name)); tr.appendChild(tdName);
          var tdType = el("td"); tdType.appendChild(el("span", "type", rec.record_type)); tr.appendChild(tdType);
          var tdSource = el("td"); tdSource.appendChild(sourceNodeText(rec.source_node)); tr.appendChild(tdSource);
          var isDNSPod = rec.provider === "dnspod";
          tr.appendChild(el("td", "", isDNSPod ? "腾讯云 DNSPod" : "Cloudflare"));
          var tdOptions = el("td");
          if(isDNSPod){
            var weight = rec.weight === undefined ? "权重未设置" : rec.weight === 0 ? "权重关闭" : "权重 " + rec.weight;
            var id = rec.record_id ? " · ID " + rec.record_id : "";
            tdOptions.textContent = (rec.record_line_name || rec.record_line || "默认") + " · " + weight + id;
          } else {
            tdOptions.appendChild(proxiedTag(rec.proxied));
          }
          tr.appendChild(tdOptions);
          var ttl = isDNSPod ? configuredDNSPodTTL(rec) : rec.ttl || 1;
          var ttlLabel = isDNSPod ? (ttl === undefined ? "沿用现有 TTL" : ttl + " 秒") : ttlText(ttl);
          tr.appendChild(el("td", "", ttlLabel));
          var tdContent = el("td"); tdContent.appendChild(el("span", st.last_ip ? "mono ip" : "empty-cell", st.last_ip || "—")); tr.appendChild(tdContent);
          tr.appendChild(el("td", rec.comment ? "" : "empty-cell", rec.comment || "—"));

          var tdAct = el("td");
          var wrap = el("div", "actions");
          var editBtn = el("button", "edit-btn", "编辑");
          editBtn.onclick = function(){ startEdit(i); };
          var delBtn = el("button", "delete-btn", "删除");
          delBtn.onclick = function(){ if(confirm("确定删除这条记录？")){ saveRecords(records.filter(function(_, index){ return index !== i; })); } };
          wrap.appendChild(editBtn); wrap.appendChild(delBtn);
          tdAct.appendChild(wrap);
          tr.appendChild(tdAct);

          tbody.appendChild(tr);
        });
      }

      function fillSourceOptions(){
        var sel = document.getElementById("fSource");
        sel.innerHTML = "";
        NODES.forEach(function(n){
          var o = el("option"); o.value = n.uuid; o.textContent = n.name + " (" + n.uuid.slice(0,8) + ")";
          sel.appendChild(o);
        });
      }

      function startEdit(i){
        editingIndex = i;
        var isNew = i < 0;
        var rec = isNew ? { record_name:"", record_type:"A", source_node:[], ttl:1, proxied:false, comment:"" } : records[i];
        document.getElementById("editTitle").textContent = isNew ? "添加记录" : "编辑记录";
        document.getElementById("fName").value = rec.record_name || "";
        document.getElementById("fType").value = rec.record_type || "A";
        document.getElementById("fProvider").value = rec.provider || "cloudflare";
        document.getElementById("fDomain").value = rec.domain || "";
        document.getElementById("fWeight").value = rec.weight ?? "";
        document.getElementById("fRecordId").value = rec.record_id ?? "";
        var ttlSelect = document.getElementById("fTtl");
        var customTtl = ttlSelect.querySelector("[data-custom]");
        if(customTtl) customTtl.remove();
        var ttl = rec.ttl || 1;
        if(!TTL_LABELS[ttl]){
          customTtl = el("option", "", ttlText(ttl));
          customTtl.value = String(ttl);
          customTtl.dataset.custom = "";
          ttlSelect.appendChild(customTtl);
        }
        ttlSelect.value = String(ttl);
        var dnsPodTtl = document.getElementById("fDNSPodTtl");
        var dnsPodSeconds = rec.provider === "dnspod" ? configuredDNSPodTTL(rec) : DNSPOD_DEFAULT_TTL;
        dnsPodTtl.value = dnsPodSeconds ?? "";
        dnsPodTtl.placeholder = dnsPodSeconds === undefined ? "留空保留现有记录的 TTL" : "";
        updateProviderFields();
        scheduleDNSPodLines(0);
        document.getElementById("fComment").value = rec.comment || "";
        document.getElementById("fProxied").checked = !!rec.proxied;
        updateProxyText();
        fillSourceOptions();
        var srcSel = document.getElementById("fSource");
        srcSel.value = (rec.source_node && rec.source_node[0]) || "";
        document.getElementById("delEdit").classList.toggle("hidden", isNew);
        document.getElementById("editPanel").classList.remove("hidden");
        document.getElementById("listPanel").classList.add("hidden");
      }

      function closeEdit(){
        cancelLineLookup();
        document.getElementById("editPanel").classList.add("hidden");
        document.getElementById("listPanel").classList.remove("hidden");
        editingIndex = -1;
      }

      function updateProviderFields(){
        var isDNSPod = document.getElementById("fProvider").value === "dnspod";
        document.getElementById("proxyField").classList.toggle("hidden", isDNSPod);
        document.getElementById("cloudflareTtlField").classList.toggle("hidden", isDNSPod);
        document.querySelectorAll("[data-dnspod]").forEach(function(field){
          field.classList.toggle("hidden", !isDNSPod);
        });
      }

      function cancelLineLookup(){
        clearTimeout(lineLookupTimer);
        lineLookupVersion++;
        lineLookupDomain = "";
      }

      function setLinePlaceholder(text){
        var select = document.getElementById("fLine");
        var placeholder = el("option", "", text);
        placeholder.value = "";
        placeholder.disabled = true;
        placeholder.selected = true;
        select.replaceChildren(placeholder);
        select.disabled = true;
        return select;
      }

      function scheduleDNSPodLines(delay){
        cancelLineLookup();
        var status = document.getElementById("lineStatus");
        status.textContent = "";
        status.classList.remove("line-error");
        document.getElementById("retryLines").classList.add("hidden");
        setLinePlaceholder("请先填写解析域名");
        if(document.getElementById("fProvider").value !== "dnspod") return;
        var domain = dnsName(document.getElementById("fDomain").value);
        lineLookupDomain = domain;
        if(domain.length > 253 || !/^[^\s./:@?#\\]+(?:\.[^\s./:@?#\\]+)+$/.test(domain)) return;
        setLinePlaceholder("正在加载可用线路…");
        var version = lineLookupVersion;
        lineLookupTimer = setTimeout(function(){ loadDNSPodLines(domain, version); }, delay);
      }

      async function loadDNSPodLines(domain, version){
        var status = document.getElementById("lineStatus");
        try {
          var response = await fetch(DNSPOD_LINES_URL + "?domain=" + encodeURIComponent(domain), { credentials: "same-origin" });
          var data = await response.json();
          if(version !== lineLookupVersion) return;
          if(!response.ok || !Array.isArray(data.lines)) throw new Error(data.error || "DNSPod 线路查询失败");
          if(!data.lines.length){
            setLinePlaceholder("该域名暂无可用线路");
            return;
          }

          var previous = records[editingIndex];
          var savedLine = previous && previous.provider === "dnspod" && dnsName(previous.domain || "") === domain
            ? previous.record_line || "默认" : "";
          var selected = data.lines.find(function(line){ return line.id === savedLine || line.value === savedLine; });
          if(savedLine && !selected) selected = data.lines.find(function(line){ return line.name === savedLine; });
          if(!savedLine) selected = data.lines.find(function(line){ return line.value === "默认"; });

          var select = setLinePlaceholder("请选择线路");
          data.lines.forEach(function(line){
            var option = el("option", "", line.name);
            // Keep the stored spelling of legacy lines when editing other fields.
            option.value = line === selected && savedLine ? savedLine : line.value;
            option.dataset.lineName = line.name;
            option.selected = line === selected;
            select.appendChild(option);
          });
          select.disabled = false;
          if(savedLine && !selected){
            status.textContent = "原线路（" + (previous.record_line_name || savedLine) + "）当前不可用，请重新选择。";
            status.classList.add("line-error");
          }
        } catch(e){
          if(version !== lineLookupVersion) return;
          setLinePlaceholder("线路加载失败");
          status.textContent = e.message;
          status.classList.add("line-error");
          document.getElementById("retryLines").classList.remove("hidden");
        }
      }

      function updateProxyText(){
        var on = document.getElementById("fProxied").checked;
        document.getElementById("proxyText").textContent = on ? "已代理" : "未代理";
      }

      function validate(rec){
        if(!rec.record_name){ return "请输入记录名称"; }
        if(!rec.record_name.includes(".")){ return "记录名称应为完整域名（FQDN）"; }
        if(!rec.source_node || rec.source_node.length === 0){ return "请至少选择一个来源节点"; }
        if(rec.provider === "dnspod"){
          if(!rec.domain.includes(".") || (rec.record_name !== rec.domain && !rec.record_name.endsWith("." + rec.domain))){
            return "解析域名必须是记录名称本身或其上级域名";
          }
          if(rec.weight !== undefined && (!Number.isInteger(rec.weight) || rec.weight < 0 || rec.weight > 100)){
            return "权重必须是 0 到 100 的整数，或留空";
          }
          if(rec.record_id !== undefined && (!Number.isSafeInteger(rec.record_id) || rec.record_id < 1)){
            return "DNSPod 记录 ID 必须是正整数，或留空";
          }
        }
        return null;
      }

      async function saveRecords(next){
        msg("保存中…");
        try {
          var r = await fetch(RECORDS_URL, { method:"PUT", credentials:"same-origin", headers:{"Content-Type":"application/json"}, body: JSON.stringify(next) });
          if(r.status === 401){ msg("未授权（请以管理员身份登录）", "err"); return; }
          var d = await r.json();
          if(d.error){ msg("保存失败: "+d.error, "err"); }
          else {
            records = next;
            var parts = ["记录已保存"];
            if((d.added||0) > 0) parts.push("新增 "+d.added+" 条");
            if((d.edited||0) > 0) parts.push("修改 "+d.edited+" 条");
            if((d.removed||0) > 0) parts.push("删除 "+d.removed+" 条");
            if((d.added||0) > 0 || (d.edited||0) > 0 || (d.removed||0) > 0) parts.push("共 "+d.total+" 条");
            msg(parts.join("，"), "ok"); renderList(); closeEdit();
          }
        } catch(e){ msg("请求失败: "+e.message, "err"); }
      }

      document.getElementById("add").onclick = function(){ startEdit(-1); };
      document.getElementById("cancel").onclick = closeEdit;
      document.getElementById("fProxied").onchange = updateProxyText;
      document.getElementById("fProvider").onchange = function(){
        updateProviderFields();
        if(this.value === "dnspod" && lineLookupDomain !== dnsName(document.getElementById("fDomain").value)){
          scheduleDNSPodLines(0);
        }
      };
      document.getElementById("fDomain").oninput = function(){
        if(lineLookupDomain !== dnsName(this.value)) scheduleDNSPodLines(350);
      };
      document.getElementById("fLine").onchange = function(){
        var status = document.getElementById("lineStatus");
        status.textContent = "";
        status.classList.remove("line-error");
      };
      document.getElementById("retryLines").onclick = function(){ scheduleDNSPodLines(0); };

      document.getElementById("save").onclick = function(){
        var rec = {
          record_name: document.getElementById("fName").value.trim(),
          record_type: document.getElementById("fType").value,
          source_node: Array.from(document.getElementById("fSource").selectedOptions).map(function(o){ return o.value; }),
          proxied: document.getElementById("fProxied").checked,
          comment: document.getElementById("fComment").value.trim() || undefined,
        };
        var existing = records[editingIndex];
        if(document.getElementById("fProvider").value === "dnspod"){
          rec.provider = "dnspod";
          rec.domain = dnsName(document.getElementById("fDomain").value);
          rec.record_name = dnsName(rec.record_name);
          var line = document.getElementById("fLine");
          if(line.disabled || !line.value || rec.domain !== lineLookupDomain){
            msg("请填写解析域名并选择可用线路", "err");
            return;
          }
          rec.record_line = line.value === "0" ? "默认" : line.value;
          rec.record_line_name = line.selectedOptions[0].dataset.lineName;
          rec.proxied = false;
          var weight = document.getElementById("fWeight");
          var recordId = document.getElementById("fRecordId");
          if(!weight.checkValidity() || !recordId.checkValidity()){
            msg("请填写有效的权重和 DNSPod 记录 ID", "err");
            return;
          }
          if(weight.value !== "") rec.weight = Number(weight.value);
          if(recordId.value !== "") rec.record_id = Number(recordId.value);
          var ttl = document.getElementById("fDNSPodTtl");
          var keepExistingTtl = existing && existing.provider === "dnspod" &&
            configuredDNSPodTTL(existing) === undefined && recordKey(existing) === recordKey(rec);
          if(!ttl.checkValidity() || (ttl.value === "" && !keepExistingTtl)){
            msg("请输入 1 到 604800 秒的整数 TTL", "err");
            return;
          }
          if(ttl.value !== "") rec.ttl_seconds = Number(ttl.value);
        } else {
          rec.ttl = Number(document.getElementById("fTtl").value) || 1;
          if(existing && existing.provider !== "dnspod") rec.zone_id = existing.zone_id;
        }
        var err = validate(rec);
        if(err){ msg(err, "err"); return; }
        var next = records.slice();
        if(editingIndex >= 0){ next[editingIndex] = rec; }
        else { next.push(rec); }
        saveRecords(next);
      };

      document.getElementById("delEdit").onclick = function(){
        if(editingIndex < 0) return;
        if(!confirm("确定删除这条记录？")) return;
        saveRecords(records.filter(function(_, index){ return index !== editingIndex; }));
      };

      document.getElementById("sync").onclick = async function(){
        var btn = document.getElementById("sync"); btn.disabled = true; msg("同步中…");
        try {
          var r = await fetch(SYNC_URL, { method:"POST", credentials:"same-origin" });
          var d = await r.json();
          if(d.error){ msg("同步失败: "+d.error, "err"); }
          else {
            var okCount = (d.records||[]).filter(function(x){ return !x.error && !x.skipped; }).length;
            var parts = ["共 " + d.total + " 条"];
            if (okCount > 0) parts.push("更新/创建 " + okCount + " 条");
            if ((d.skipped||0) > 0) parts.push("跳过 " + d.skipped + " 条");
            if ((d.errors||0) > 0) parts.push("失败 " + d.errors + " 条");
            msg("完成：" + parts.join("，"), (d.errors?"err":"ok"));
          }
        } catch(e){ msg("请求失败: "+e.message, "err"); }
        finally { btn.disabled = false; await loadState(); renderList(); }
      };

      var LOGS_URL = "/cf-ddns/logs";

      function actLabel(a){ return ({ create:"创建", update:"更新", skip:"跳过", error:"错误", sync:"同步", delete:"删除", add:"新增", edit:"修改" })[a] || a; }

      function switchTab(which){
        cancelLineLookup();
        var isLog = which === "logs";
        document.getElementById("tabRecords").classList.toggle("active", !isLog);
        document.getElementById("tabLogs").classList.toggle("active", isLog);
        document.getElementById("listPanel").classList.toggle("hidden", isLog);
        document.getElementById("logPanel").classList.toggle("hidden", !isLog);
        document.getElementById("editPanel").classList.add("hidden");
        if(isLog){ fillLogActionFilter(); loadLogs(); }
      }

      function fillLogRecordFilter(logs){
        var sel = document.getElementById("logRecord");
        var prev = sel.value;
        sel.innerHTML = '<option value="">全部记录</option>';
        var names = new Set();
        // Include current records and records seen in logs (e.g. deleted ones).
        records.forEach(function(r){ names.add(r.record_name); });
        (logs || []).forEach(function(l){ if(l.record_name) names.add(l.record_name); });
        Array.from(names).sort().forEach(function(name){
          var o = el("option");
          o.value = name;
          o.textContent = name;
          sel.appendChild(o);
        });
        sel.value = prev;
      }

      function fillLogActionFilter(){
        var sel = document.getElementById("logAction");
        var prev = sel.value;
        var actions = [
          { k: "create", label: "创建" },
          { k: "update", label: "更新" },
          { k: "skip", label: "跳过" },
          { k: "error", label: "错误" },
          { k: "sync", label: "同步" },
          { k: "delete", label: "删除" },
          { k: "add", label: "新增" },
          { k: "edit", label: "修改" }
        ];
        sel.innerHTML = '<option value="">全部操作</option>';
        actions.forEach(function(a){
          var o = el("option");
          o.value = a.k;
          o.textContent = a.label;
          sel.appendChild(o);
        });
        sel.value = prev;
      }

      async function loadLogs(){
        var rec = document.getElementById("logRecord").value;
        var act = document.getElementById("logAction").value;
        var limit = document.getElementById("logLimit").value || 100;
        var url = LOGS_URL + "?limit=" + encodeURIComponent(limit);
        if(rec) url += "&record=" + encodeURIComponent(rec);
        if(act) url += "&action=" + encodeURIComponent(act);
        try {
          var r = await fetch(url, { credentials: "same-origin" });
          if(r.status === 401){ msg("未授权（请以管理员身份登录）", "err"); return; }
          var d = await r.json();
          // Refresh filter options with record names seen in the full log set.
          fillLogRecordFilter(d.logs || []);
          renderLogs(d.logs || []);
        } catch(e){ msg("加载日志失败: " + e.message, "err"); }
      }

      function renderLogs(logs){
        var tbody = document.getElementById("logBody");
        var empty = document.getElementById("logEmpty");
        tbody.innerHTML = "";
        if(logs.length === 0){ empty.classList.remove("hidden"); return; }
        empty.classList.add("hidden");
        logs.forEach(function(l){
          var tr = el("tr");
          var tdTime = el("td"); tdTime.textContent = fmt(l.time); tr.appendChild(tdTime);
          var tdName = el("td"); tdName.appendChild(el("span", "mono name", l.record_name || "—")); tr.appendChild(tdName);
          if(l.provider === "dnspod"){
            tdName.appendChild(el("div", "hint", "DNSPod · " + (l.record_line || "默认") + (l.record_id ? " · ID " + l.record_id : "")));
          }
          var tdType = el("td"); tdType.appendChild(el("span", "type", l.record_type || "")); tr.appendChild(tdType);
          var tdAct = el("td"); tdAct.appendChild(el("span", "act " + l.action, actLabel(l.action))); tr.appendChild(tdAct);
          var tdDetail = el("td"); tdDetail.className = l.action === "error" ? "detail-err" : ""; tdDetail.textContent = l.detail || ""; tr.appendChild(tdDetail);
          tbody.appendChild(tr);
        });
      }

      async function clearLogs(){
        if(!confirm("确定清空所有日志？此操作不可恢复。")) return;
        try {
          var r = await fetch(LOGS_URL, { method: "DELETE", credentials: "same-origin" });
          if(r.ok){ msg("日志已清空", "ok"); loadLogs(); }
          else { msg("清空失败", "err"); }
        } catch(e){ msg("请求失败: " + e.message, "err"); }
      }

      document.getElementById("tabRecords").onclick = function(){ switchTab("records"); };
      document.getElementById("tabLogs").onclick = function(){ switchTab("logs"); };
      document.getElementById("logRefresh").onclick = loadLogs;
      document.getElementById("logClear").onclick = clearLogs;
      document.getElementById("logRecord").onchange = loadLogs;
      document.getElementById("logAction").onchange = loadLogs;
      document.getElementById("logLimit").onchange = loadLogs;

      async function init(){
        await loadNodes();
        try {
          var r = await fetch(RECORDS_URL, { credentials:"same-origin" });
          if(r.ok){ var d = await r.json(); if(Array.isArray(d)) records = d; }
        } catch(e){ records = []; }
        await loadState();
        renderList();
        fillLogRecordFilter();
      }
      init();
    </script>
  </body>
</html>
